questions:
  - label: 완료와 진행
    question: 결과가 검토까지 끝났나요, 초안이나 진행 중인 일인가요?
    criterion: 작성, 검토, 승인, 완료를 원문 기록에 따라 구분합니다. 회의나 투입 시간을 결과물의 완료로 바꾸지 않습니다.
    ifUnknown: 검토나 승인 기록이 없으면 해당 상태를 확인할 항목으로 남깁니다.
  - label: 지표의 의미
    question: 수치의 단위와 분모가 분명한가요?
    criterion: 초안 6개와 검토 완료 6개를 구분합니다. 합의된 완료 기준 없이 초안 비율을 전체 완료율로 표시하지 않습니다.
    ifUnknown: 분모, 비교 기간, 기준값이 없으면 수치 해석을 제한하고 필요한 정보를 적습니다.
  - label: 필요한 결정
    question: 누가 무엇을 결정하거나 지원해야 다음 단계로 갈 수 있나요?
    criterion: 막힌 원인, 필요한 요청, 지연의 영향을 연결합니다. 알려진 담당자와 기한만 사용합니다.
    ifUnknown: 영향이나 결정권자가 불명확하면 추측하지 않고 요청할 역할과 확인할 내용을 적습니다.
output:
  - 보고 목적에 맞춰 중요한 결정 요청이나 막힌 일을 먼저 적습니다.
  - 완료한 결과, 진행 중인 일, 위험, 다음 계획을 제목으로 나눕니다.
  - 주요 수치에는 작업 상태, 단위, 분모를 붙입니다.
  - 보고문과 내부 확인 질문을 분리합니다. 보고를 발송하거나 상태를 변경했다고 표현하지 않습니다.

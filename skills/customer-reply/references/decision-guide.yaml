questions:
  - label: 고객의 요청
    question: 고객이 겪는 문제와 원하는 해결은 무엇인가요?
    criterion: 문의 내용과 고객이 기대하는 결과를 파악합니다. 고객의 진술과 확인된 주문 상태는 구분합니다.
    ifUnknown: 답변에 꼭 필요한 정보만 내부 확인 항목으로 남깁니다. 비밀번호나 전체 결제 정보를 요청하지 않습니다.
  - label: 정책과 개별 상태
    question: 일반 정책만으로 이 고객의 상황을 확답할 수 있나요?
    criterion: 확인된 정책을 적용하되 실제 출고, 환불 자격, 예외 승인 여부가 확인되었는지 따로 봅니다.
    ifUnknown: 확인되지 않은 배송일, 환불, 처리 결과를 보장하지 않습니다. 확인할 대상과 가능한 다음 단계를 적습니다.
  - label: 답변의 약속
    question: 답변에 담긴 약속을 제공된 사실로 뒷받침할 수 있나요?
    criterion: 실제로 확인하거나 처리한 일만 완료형으로 표현합니다. 알려지지 않은 회신 기한이나 보상을 추가하지 않습니다.
    ifUnknown: 확정하지 못한 내용은 가능한 안내와 확인이 필요한 사항으로 나눕니다.
output:
  - 고객에게 보낼 초안을 짧고 정중하게 작성합니다.
  - 문의에 대한 답과 다음 단계를 분명히 적습니다.
  - 내부에서 확인할 주문 상태나 정책은 고객용 본문 밖에 따로 적습니다.
  - 불필요한 개인 정보를 반복하지 않으며 실제 발송이나 주문 변경은 수행하지 않습니다.

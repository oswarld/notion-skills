questions:
  - label: 배울 결과
    question: 첫 주가 끝나면 무엇을 이해하거나 수행할 수 있어야 하나요?
    criterion: 역할과 관련된 학습 목표를 자료 읽기, 관찰, 작은 실습, 피드백으로 연결합니다.
    ifUnknown: 역할이나 목표가 없으면 초안의 가정과 확인할 질문을 적습니다.
  - label: 자료와 동료 일정
    question: 실제로 준비된 자료와 동료의 가용 시간에 맞나요?
    criterion: 알려진 문서와 예시만 연결하고 검토 가능한 날에 피드백을 배치합니다. 지원 담당자는 확정된 경우만 적습니다.
    ifUnknown: 없는 자료와 미정 담당자를 준비 항목으로 남깁니다. 내부 링크나 동료 일정을 만들어 넣지 않습니다.
  - label: 접근 권한
    question: 실습에 필요한 권한이 승인되어 있나요?
    criterion: 승인 전에는 익명화된 예시나 연습 환경을 사용합니다. 권한이나 동료 일정이 막혔을 때 할 수 있는 대체 활동을 제안합니다.
    ifUnknown: 승인 여부가 불명확하면 실제 고객 정보에 접근하는 계획을 확정하지 않습니다.
output:
  - 첫 주 학습 목표와 준비할 자료, 권한을 정리합니다.
  - 요일별 활동, 기대 결과, 지원 역할, 선행 조건을 표로 적습니다.
  - 이해도를 확인할 질문과 피드백 시간을 포함합니다.
  - 미승인 권한의 대체 활동을 적고 초대, 권한 부여, 일정 예약을 수행했다고 표현하지 않습니다.

questions:
  - label: 의견의 주제
    question: 표현이 달라도 같은 필요나 문제를 말하고 있나요?
    criterion: 원문 번호를 유지하며 문제별로 묶습니다. 긍정 의견과 부정 의견이 섞이면 둘 다 보존합니다.
    ifUnknown: 여러 해석이 가능한 의견은 억지로 한 주제로 단정하지 않고 원문과 해석을 구분합니다.
  - label: 빈도와 표본
    question: 세고 있는 것은 의견, 사건, 고객 중 무엇인가요?
    criterion: 제공된 데이터 안의 건수와 분모를 밝힙니다. 중복 복사된 의견을 별도 고객으로 세지 않습니다.
    ifUnknown: 같은 사람이 남긴 것인지 모르면 고객 수로 표현하지 않습니다. 작은 표본을 전체 시장의 비율로 일반화하지 않습니다.
  - label: 개선 우선순위
    question: 어떤 개선 후보가 사용자 기준과 관찰된 영향에 부합하나요?
    criterion: 빈도, 심각도, 실행 가능성을 제공된 근거 안에서 비교합니다. 고객의 요구와 제안한 해결책을 구분합니다.
    ifUnknown: 매출 영향이나 개발 비용이 없으면 수치 점수를 만들지 않고 필요한 확인을 적습니다.
output:
  - 주제, 근거가 되는 의견 번호, 관찰된 영향, 건수를 정리합니다.
  - 유지할 장점과 해결할 문제를 함께 표시합니다.
  - 개선 후보와 우선순위의 이유를 적고 확정된 로드맵으로 표현하지 않습니다.
  - 중복 가능성, 표본 범위, 반대 의견 등 해석의 한계를 적습니다.

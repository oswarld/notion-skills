questions:
  - label: 완료 기준
    question: 무엇이 나오면 프로젝트가 끝났다고 판단할 수 있나요?
    criterion: 활동 목록보다 확인 가능한 결과물을 먼저 정합니다. 초안 작성과 검토 완료 등 서로 다른 상태를 구분합니다.
    ifUnknown: 완료 기준이 없으면 제안임을 표시하고 확정할 질문을 남깁니다.
  - label: 의존 관계와 일정
    question: 앞선 작업과 검토 시간을 고려해 일정이 가능한가요?
    criterion: 선행 작업, 외부 검토, 실제 가용 인원을 연결합니다. 검토 대기 시간을 없다고 가정하지 않습니다.
    ifUnknown: 작업량이나 참여 가능 시간이 없으면 일정의 가정을 밝힙니다. 기한이 어려우면 범위나 일정 조정안을 제시합니다.
  - label: 역할과 상태
    question: 담당자와 실행 상태가 실제로 확정되었나요?
    criterion: 확인된 담당자만 배정하고 나머지는 필요한 역할로 제안합니다. 수행 증거가 없는 일은 계획 상태로 둡니다.
    ifUnknown: 담당자와 승인 여부는 미정으로 남깁니다. 참여 가능한 사람을 임의로 만들어 넣지 않습니다.
output:
  - 목표와 완료 기준을 먼저 적습니다.
  - 단계, 결과물, 완료 확인 방법, 담당 역할, 선행 조건, 일정을 표로 정리합니다.
  - 주요 위험과 일정이 달라질 조건을 짧게 설명합니다.
  - 시작 전에 필요한 결정을 적고 실제 업무 배정이나 상태 변경은 수행하지 않습니다.

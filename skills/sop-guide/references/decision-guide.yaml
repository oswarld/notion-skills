questions:
  - label: 시작 조건
    question: 언제 누가 어떤 자료와 권한을 갖추고 시작하나요?
    criterion: 반복 업무의 시작 계기, 작업자, 입력 자료, 접근 권한을 정리합니다. 현재 절차와 개선 제안을 구분합니다.
    ifUnknown: 필요한 경로나 권한이 없으면 질문으로 남깁니다. 실제 메뉴, 명령, 내부 주소를 만들어 넣지 않습니다.
  - label: 따라 할 수 있는 단계
    question: 각 단계의 행동과 예상 결과가 구체적인가요?
    criterion: 선행 조건을 먼저 배치하고 한 단계에 한 행동을 적습니다. 원문의 확인 절차와 예외 조건을 보존합니다.
    ifUnknown: 처음 맡은 사람이 수행하기 어려운 단계는 빠진 정보를 표시합니다.
  - label: 예외와 완료
    question: 실패하면 어떻게 대응하고 무엇으로 완료를 확인하나요?
    criterion: 제공된 예외 대응과 연락 경로를 사용합니다. 버튼 클릭 여부보다 실제 결과를 확인하는 항목을 만듭니다.
    ifUnknown: 대응 방법이나 담당자가 없으면 확인할 항목으로 남깁니다. 삭제나 외부 공유 절차의 확인 단계를 임의로 생략하지 않습니다.
output:
  - 목적, 시작 조건, 준비 자료를 먼저 적습니다.
  - 순서가 있는 작업은 번호 목록으로 쓰고 각 단계의 예상 결과를 붙입니다.
  - 예외 상황, 대응 방법, 확인할 담당자를 별도 표로 정리합니다.
  - 실제 완료 상태를 확인할 체크리스트와 보완 질문을 남깁니다.

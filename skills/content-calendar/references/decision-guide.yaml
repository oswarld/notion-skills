questions:
  - label: 독자와 메시지
    question: 각 콘텐츠가 독자의 어떤 질문에 답하나요?
    criterion: 주제별 핵심 메시지와 독자에게 기대하는 행동을 연결합니다. 입문 내용과 심화 내용의 순서를 구분합니다.
    ifUnknown: 독자나 목적이 없으면 초안의 가정을 적습니다. 독자 반응이나 수요를 이미 확인했다고 말하지 않습니다.
  - label: 제작 여력
    question: 촬영, 작성, 검토를 포함해 실제로 만들 수 있는 일정인가요?
    criterion: 제공된 제작 횟수와 시간을 지킵니다. 새로 만드는 원본과 다른 채널에 맞춘 재구성을 구분해 중복 제작을 줄입니다.
    ifUnknown: 제작량이 불명확하면 제안한 발행 빈도를 가정으로 표시하고 필요한 인력이나 자료를 적습니다.
  - label: 자료와 주장
    question: 사용할 자료가 있고, 콘텐츠의 주장을 뒷받침하나요?
    criterion: 기존 사진과 원문을 연결하고 새로 준비할 자료를 표시합니다. 확인되지 않은 효과, 후기, 할인, 긴급성을 넣지 않습니다.
    ifUnknown: 확인이 필요한 주제는 초안으로 표시합니다. 제품별 조건이나 출처가 없으면 구체적인 주장을 확정하지 않습니다.
output:
  - 기간, 채널, 주제, 핵심 메시지, 원하는 행동, 준비 자료를 표로 정리합니다.
  - 날짜가 없으면 1주차와 요일 등 상대적인 일정으로 제안합니다.
  - 재사용할 자료와 새로 제작할 자료를 구분합니다.
  - 발행 전에 확인할 사실과 검토 일정을 적고, 게시가 예약되었다고 표현하지 않습니다.

questions:
  - label: 독자의 다음 행동
    question: 독자가 이 문서를 읽고 무엇을 언제 어떻게 해야 하는지 알 수 있나요?
    criterion: 문서 목적에 필요한 날짜, 담당자, 링크, 절차가 있는지 봅니다. 문서 성격상 필요하지 않은 항목까지 요구하지 않습니다.
    ifUnknown: 독자의 행동을 막는 정보만 보완 항목으로 남깁니다. 실제 날짜나 링크 대신 눈에 띄는 자리표시자를 사용합니다.
  - label: 사실과 약속
    question: 확인된 사실, 제안, 조건부 약속이 구분되어 있나요?
    criterion: 원문에 근거가 있는지, 서로 모순되는 내용이 있는지 확인합니다. 표현을 고칠 때 수치, 적용 범위, 약속의 강도를 유지합니다.
    ifUnknown: 사실 확인이 필요한 항목과 표현만 고치면 되는 항목을 구분합니다. 근거가 없다고 거짓으로 판정하거나 외부 사실을 검증했다고 말하지 않습니다.
  - label: 블록과 용어
    question: 한 블록에 한 내용이 있고, 같은 개념을 같은 말로 쓰고 있나요?
    criterion: 독자의 이해나 실행에 영향을 주는 긴 문장, 섞인 항목, 불일치한 용어를 찾습니다. 핵심 조건과 예외가 사라지지 않도록 나눕니다.
    ifUnknown: 비슷한 표현이 같은 개념인지 불분명하면 통일하기 전에 확인할 질문으로 남깁니다.
output:
  - 먼저 독자의 행동을 막는 문제를 정리하고, 그다음 표현 개선을 제안합니다.
  - 각 의견은 원문 위치, 짧은 인용, 독자에게 미치는 영향, 수정안 또는 질문으로 정리합니다.
  - 수정안은 Notion에 옮기기 쉬운 제목과 불릿으로 구성합니다. 한 항목에는 한 내용을 담습니다.
  - 추가로 확인할 사실을 별도로 모으고, 근거가 충분한 부분에는 불필요한 유보 문구를 붙이지 않습니다.

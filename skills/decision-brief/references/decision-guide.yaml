questions:
  - label: 제약과 선호
    question: 반드시 지킬 조건과 비교할 선호가 구분되어 있나요?
    criterion: 결정할 사안, 선택지, 결정 시점, 제약을 정리합니다. 실제 선택지라면 현상 유지도 포함합니다.
    ifUnknown: 기준이 불분명하면 임의의 가중치를 부여하지 않고 결정에 중요한 질문을 남깁니다.
  - label: 같은 기준의 비교
    question: 모든 선택지를 같은 기준과 근거로 비교했나요?
    criterion: 비용, 전환 작업, 효과, 되돌릴 수 있는 정도를 확인된 범위에서 비교합니다. 근거가 없는 점수는 만들지 않습니다.
    ifUnknown: 모르는 항목은 미확인으로 둡니다. 정보가 없다는 이유만으로 열등한 선택지로 처리하지 않습니다.
  - label: 추천의 조건
    question: 어떤 조건에서 추천이 유효하고 무엇이 달라지면 재검토하나요?
    criterion: 기준에 맞는 이유와 감수할 불이익을 적습니다. 제한된 시험이나 결정 보류도 결과가 될 수 있습니다.
    ifUnknown: 중요한 미확인 요소를 확인할 가장 작은 다음 행동을 제안합니다.
output:
  - 결정할 문제와 핵심 기준을 짧게 적습니다.
  - 선택지별로 같은 항목을 비교하고 근거와 미확인 값을 표시합니다.
  - 조건부 추천과 그 이유, 추천이 바뀔 조건을 적습니다.
  - 다음 확인 작업을 남기며 추천을 이미 승인된 결정으로 표현하지 않습니다.

questions:
  - label: 요청과 목적
    question: 받는 사람이 어떤 행동이나 답변을 하면 되나요?
    criterion: 안내, 부탁, 일정 조율 중 목적을 구분하고 핵심 요청을 앞부분에 둡니다. 원문에 있는 기한만 사용합니다.
    ifUnknown: 요청이 불분명하면 확인할 질문을 남깁니다. 상대에게 새로운 의무나 기한을 만들지 않습니다.
  - label: 사실과 약속
    question: 사유, 일정, 첨부, 약속이 제공된 사실과 맞나요?
    criterion: 확정된 일정과 후보 일정을 구분합니다. 제공하지 않은 사유, 첨부 파일, 승인 사실, 보상 약속을 추가하지 않습니다.
    ifUnknown: 꼭 필요한 정보는 자리표시자로 남깁니다. 없어도 전달되는 세부사항은 생략합니다.
  - label: 관계와 말투
    question: 상대와의 관계에 맞고 요청을 쉽게 이해할 수 있나요?
    criterion: 지정한 말투와 길이를 따르고, 한 문단에 한 내용을 담습니다. 사과나 수식어가 핵심 요청을 가리지 않게 합니다.
    ifUnknown: 관계가 명시되지 않으면 짧고 정중하게 씁니다. 친밀한 관계라고 가정하지 않습니다.
output:
  - 제목과 받는 사람에게 보낼 본문을 구분합니다.
  - 본문은 목적, 필요한 사실, 요청 순서로 정리합니다. 상황에 따라 순서를 조정할 수 있습니다.
  - 보내기 전에 확인할 정보는 본문 밖에 따로 적습니다.
  - 초안만 작성하며 실제로 보냈거나 일정을 변경했다고 표현하지 않습니다.

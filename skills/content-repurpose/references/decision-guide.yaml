questions:
  - label: 유지할 의미
    question: 원문의 핵심 주장과 조건, 말투가 유지되나요?
    criterion: 남겨야 할 표현과 사실을 먼저 확인합니다. 짧게 줄이더라도 예외나 조건을 빼서 의미를 강화하지 않습니다.
    ifUnknown: 생략하면 뜻이 달라지는 부분은 유지하거나 확인할 항목으로 남깁니다.
  - label: 채널과 길이
    question: 요청한 채널의 형식과 사용자가 지정한 길이에 맞나요?
    criterion: 채널별로 도입과 구성을 조정합니다. 글자 수 제한이 있으면 공백 포함 여부 등 계산 기준을 밝히고 실제 길이를 확인합니다.
    ifUnknown: 길이 기준이 없으면 작업용 기준을 제안합니다. 확인하지 않은 플랫폼 제한을 사실처럼 적지 않습니다.
  - label: 추가된 내용
    question: 원문에 없는 사실이나 판매 문구가 추가되지 않았나요?
    criterion: 실적, 후기, 할인, 희소성, 인용문은 원문에 근거가 있을 때만 사용합니다. 사용자가 제외한 표현을 지킵니다.
    ifUnknown: 새 사실이 필요한 문장은 제외하거나 보완 질문으로 남깁니다.
output:
  - 채널별 제목과 초안을 구분해 바로 검토할 수 있게 정리합니다.
  - 길이 제한이 있으면 확인한 글자 수와 계산 기준을 함께 적습니다.
  - 원문과 의미가 달라질 수 있는 변경을 짧게 알립니다.
  - 확인할 정보를 초안 밖에 적고 실제 게시나 예약은 수행하지 않습니다.

questions:
  - label: 질문과 근거
    question: 이 자료가 알아보고 싶은 질문에 어떤 근거를 제공하나요?
    criterion: 자료의 직접 관찰, 자료 작성자의 주장, 요약자의 해석을 구분합니다. 출처 이름이나 원문 위치를 붙입니다.
    ifUnknown: 내용을 읽을 수 없는 링크는 읽었다고 표현하지 않습니다. 필요한 발췌문이나 접근 가능한 자료를 요청합니다.
  - label: 비교 가능성
    question: 기간, 대상, 단위와 정의가 같아서 직접 비교할 수 있나요?
    criterion: 같은 기준의 수치만 묶습니다. 인터뷰 참여자 수, 문의 건수, 고객 수를 하나의 분모로 합치지 않습니다.
    ifUnknown: 조사 기간이나 방법이 없으면 비교의 한계를 명시하고 자료별 수치를 따로 둡니다.
  - label: 결론의 범위
    question: 현재 근거로 어디까지 결론 내릴 수 있나요?
    criterion: 공통점과 반대 근거를 함께 보고, 근거의 범위를 넘는 일반화나 인과 주장을 피합니다.
    ifUnknown: 결론을 가를 핵심 정보와 다음에 확인할 자료를 적습니다. 판단을 보류할 수 있습니다.
output:
  - 조사 질문에 대한 답을 근거가 뒷받침하는 범위에서 먼저 적습니다.
  - 출처별 주장, 근거, 차이, 한계를 비교표로 정리합니다.
  - 해석이나 추론에는 이를 뒷받침하는 출처와 가정을 붙입니다.
  - 남은 쟁점과 가장 먼저 확인할 정보를 별도로 적습니다.

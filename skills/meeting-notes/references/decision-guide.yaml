questions:
  - label: 결정과 제안
    question: 실제로 합의한 내용인가요, 아직 검토 중인 제안인가요?
    criterion: 명시적인 합의나 확정 표현이 있는 내용을 결정으로 분류합니다. 제안, 보류, 반대 의견은 구분하고 짧은 원문 근거를 붙입니다.
    ifUnknown: 합의 여부를 알 수 없으면 미결 사항으로 남깁니다. 반대가 없다는 이유만으로 합의했다고 판단하지 않습니다.
  - label: 실행할 일
    question: 무엇을 해야 하고, 어떤 결과가 나오면 완료인가요?
    criterion: 실행할 행동과 원문에 나온 완료 조건을 분리해 적습니다. 한 불릿에 여러 할 일이 있으면 항목을 나눕니다.
    ifUnknown: 행동이나 완료 조건이 불분명하면 보완할 질문을 남깁니다. 제안을 이미 확정된 할 일로 옮기지 않습니다.
  - label: 담당자와 기한
    question: 담당자와 기한이 실제로 정해졌나요?
    criterion: 명시된 담당자와 기한만 기록합니다. 의견을 말한 사람과 일을 맡은 사람을 구분합니다. 상대 날짜는 회의 날짜와 시간대를 알아야 변환합니다.
    ifUnknown: 담당자나 기한은 미정으로 표시합니다. 날짜 기준이 없으면 이번 주, 다음 금요일 같은 원문 표현을 유지합니다.
  - label: 선행 조건
    question: 먼저 해결해야 할 일이나 남아 있는 이견이 있나요?
    criterion: 승인, 검토, 다른 작업의 완료가 필요한 경우 해당 할 일에 연결합니다. 결정에 영향을 주는 이견을 남깁니다.
    ifUnknown: 기록에 선행 조건이 없으면 언급 없음으로 적습니다. 선행 조건이 없다고 단정하지 않습니다.
output:
  - 회의 맥락을 짧게 요약하고, 결정 사항과 검토 중인 제안을 별도 제목 아래 정리합니다.
  - 확정된 할 일은 작업, 완료 조건, 담당자, 기한, 선행 조건을 열로 하는 표로 정리합니다.
  - 미결 사항은 확인할 내용과 필요한 정보를 한 항목씩 적습니다.
  - 결정과 주요 할 일에는 짧은 원문 인용이나 타임스탬프를 붙입니다. 근거가 없는 정보는 채우지 않습니다.

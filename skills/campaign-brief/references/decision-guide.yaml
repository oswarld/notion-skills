questions:
  - label: 목표와 행동
    question: 캠페인의 목표와 고객에게 기대하는 행동이 연결되나요?
    criterion: 사업 목표와 신청, 문의, 구매 등 관찰 가능한 행동을 구분합니다. 확인된 상품 정보로 메시지를 구성합니다.
    ifUnknown: 목표나 대상이 불분명하면 결정할 항목으로 남깁니다. 고객의 수요를 검증했다고 말하지 않습니다.
  - label: 실행 조건
    question: 기간, 채널, 자료, 예산 안에서 실행할 수 있나요?
    criterion: 신청 페이지, 콘텐츠, 검토 등 선행 작업을 연결합니다. 지정된 채널과 지출 제한을 지키고 담당자는 확정된 경우만 배정합니다.
    ifUnknown: 빠진 자료나 담당 역할을 준비 항목으로 표시합니다. 예산이나 승인 사실을 만들어 넣지 않습니다.
  - label: 성과 기준
    question: 무엇을 어떤 단위로 측정하고 목표와 비교하나요?
    criterion: 지표의 단위와 필요한 분모를 적습니다. 실제 실적, 기준값, 제안 목표, 예측을 구분합니다.
    ifUnknown: 과거 기록이 없으면 목표 수치를 임의로 정하지 않고 먼저 수집할 데이터를 제안합니다.
output:
  - 목표, 대상, 핵심 메시지, 원하는 행동을 한 장 분량으로 정리합니다.
  - 실행 순서, 필요한 자료, 담당 역할, 선행 조건을 표로 적습니다.
  - 확인할 지표와 측정 방법, 목표 수치의 근거를 구분합니다.
  - 미결 사항과 가정을 적습니다. 광고 집행이나 게시가 완료되었다고 표현하지 않습니다.

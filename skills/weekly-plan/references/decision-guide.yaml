questions:
  - label: 우선순위
    question: 반드시 지킬 마감과 다른 작업을 시작하게 하는 일이 무엇인가요?
    criterion: 확정 마감, 선행 작업, 사용자가 중요하게 보는 목표를 기준으로 순서를 정합니다. 희망 일정은 확정 마감과 구분합니다.
    ifUnknown: 중요도나 마감이 없으면 제안한 순서의 가정을 밝힙니다. 임의의 날짜를 확정하지 않습니다.
  - label: 가능한 작업량
    question: 작업 시간과 여유 시간을 합쳐도 가용 시간 안에 들어가나요?
    criterion: 날짜별 가용 시간과 배정 시간을 합산해 비교합니다. 회의, 휴가, 외근을 침범하지 않고 여유 시간도 총량에 포함합니다.
    ifUnknown: 예상 시간이 없는 작업은 추정임을 표시합니다. 추정 때문에 일정이 달라질 수 있는 작업을 먼저 확인합니다.
  - label: 조정할 일
    question: 시간이 부족하면 어떤 일을 미루거나 줄이거나 협의해야 하나요?
    criterion: 기한과 의존 관계를 지키며 조정 후보를 제시합니다. 추가 근무를 자동으로 배정하지 않습니다.
    ifUnknown: 확정할 수 없는 조정은 선택지로 남기고, 결정에 필요한 정보를 적습니다.
output:
  - 이번 주 우선순위와 그 이유를 짧게 적습니다.
  - 요일별 작업, 배정 시간, 마감을 표로 정리합니다. 날짜가 없으면 요일만 사용합니다.
  - 총 가용 시간, 작업 시간, 여유 시간을 각각 표시합니다.
  - 미룰 작업과 협의할 마감, 확인할 예상 시간을 별도로 모읍니다.
